name: Build AnimeHeaven extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out Yuzono extension framework
        uses: actions/checkout@v4
        with:
          repository: yuzono/anime-extensions
          ref: master
          path: upstream

      - name: Overlay AnimeHeaven module
        run: |
          mkdir -p upstream/src/en/animeheaven
          cp -R src/en/animeheaven/. upstream/src/en/animeheaven/

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build debug APK
        working-directory: upstream
        run: ./gradlew :src:en:animeheaven:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeHeaven-debug-apk
          path: upstream/src/en/animeheaven/build/outputs/apk/debug/*.apk
          if-no-files-found: error
